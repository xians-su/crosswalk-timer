<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1210" media="(prefers-color-scheme: dark)">
<title>過馬路時機</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="過馬路">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* Layout: one screen, read from across a desk. State word + seconds on top, cycle strip, then when to leave. */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#14201c; --muted:#5d6b66; --line:#d5dcd9;
  --go:#0a7d55; --go-bg:#dff3ea; --wait:#b3401f; --wait-bg:#fbe6de; --ink-btn:#14201c; --ink-btn-fg:#ffffff;
  --num:ui-rounded,"SF Pro Rounded","Helvetica Neue",system-ui,sans-serif;
  --text:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1210; --panel:#151d1a; --fg:#e9f0ed; --muted:#93a39d; --line:#2a3531;
  --go:#3fd69b; --go-bg:#0f2e22; --wait:#ff8a63; --wait-bg:#361a10; --ink-btn:#e9f0ed; --ink-btn-fg:#0c1210; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c1210; --panel:#151d1a; --fg:#e9f0ed; --muted:#93a39d; --line:#2a3531;
  --go:#3fd69b; --go-bg:#0f2e22; --wait:#ff8a63; --wait-bg:#361a10; --ink-btn:#e9f0ed; --ink-btn-fg:#0c1210; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.5;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:14px}
header b{color:var(--fg);font-weight:600}
#clock{font-variant-numeric:tabular-nums}
#now{border-radius:20px;padding:20px 20px 16px;text-align:center;background:var(--wait-bg);color:var(--wait);transition:background .3s,color .3s}
#now.go{background:var(--go-bg);color:var(--go)}
#now.off{background:var(--panel);color:var(--muted)}
#word{font-size:30px;font-weight:700;letter-spacing:.08em}
#secs{font-family:var(--num);font-size:clamp(96px,34vw,150px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#sub{font-size:15px;color:var(--fg)}
#strip{position:relative;height:14px;border-radius:7px;background:var(--wait);overflow:hidden;margin-top:14px;opacity:.9}
#strip i{position:absolute;top:0;bottom:0;left:0;background:var(--go)}
#strip u{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--fg);border-radius:2px}
#leave{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
#leaveMsg{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
#leaveMsg.go{color:var(--go)}
#rain{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
#rainMsg{font-size:22px;font-weight:700}
#rainMsg.wet{color:var(--wait)}
#rainSub{color:var(--muted);font-size:14px}
#nexts{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.step{display:flex;align-items:center;gap:6px}
.step output{min-width:4.2em;text-align:center;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;padding:0 12px;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--go);outline-offset:2px}
button.main{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:var(--ink-btn);font-weight:700;width:100%;min-height:52px;font-size:17px}
details{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
summary{cursor:pointer;font-weight:600;min-height:28px}
details>div{display:flex;flex-direction:column;gap:12px;margin-top:12px}
p{margin:0;color:var(--muted);font-size:14px}
#src{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
  <header><span><b>南京西路 × 赤峰街</b></span><span id="clock">--:--:--</span></header>

  <section id="now" class="off" aria-live="off">
    <div id="word">尚未對時</div>
    <div id="secs">--</div>
    <div id="sub">這個時段沒有時刻表。到「校正」按「車道剛轉紅」對時</div>
    <div id="strip" hidden><i id="stripGo"></i><u id="stripNow"></u></div>
  </section>

  <section id="leave">
    <div id="leaveMsg">--</div>
    <div class="row"><span>走到路口要</span>
      <span class="step"><button id="walkDn" aria-label="減少 5 秒">−</button><output id="walkOut">90 秒</output><button id="walkUp" aria-label="增加 5 秒">＋</button></span></div>
    <div class="row"><span>之後可以過</span><span id="nexts"></span></div>
  </section>

  <section id="rain"><div id="rainMsg">查詢天氣中</div><div id="rainSub"></div></section>

  <details id="adv">
    <summary>校正</summary>
    <div>
      <button id="sync">車道剛轉紅（以這一刻重新對時）</button>
      <div class="row"><span>提早／延後</span>
        <span class="step"><button id="nudgeDn" aria-label="提早 1 秒">−1</button><output id="nudgeOut">0 秒</output><button id="nudgeUp" aria-label="延後 1 秒">+1</button></span></div>
      <div class="row"><span>一輪長度</span>
        <span class="step"><button id="cycDn" aria-label="減少 1 秒">−</button><output id="cycOut">200 秒</output><button id="cycUp" aria-label="增加 1 秒">＋</button></span></div>
      <div class="row"><span>可過的時間</span>
        <span class="step"><button id="redDn" aria-label="減少 1 秒">−</button><output id="redOut">95 秒</output><button id="redUp" aria-label="增加 1 秒">＋</button></span></div>
      <div class="row"><span>過馬路本身要</span>
        <span class="step"><button id="crossDn" aria-label="減少 5 秒">−</button><output id="crossOut">25 秒</output><button id="crossUp" aria-label="增加 5 秒">＋</button></span></div>
      <button id="clear">清除我的對時，改用實測時刻表</button>
      <p>車道紅燈＝你可以過。平常不用校正。若某個時段不準，在路口看到南京西路車道轉紅的那一刻按「車道剛轉紅」，之後 3 小時以那一刻為準。</p>
    </div>
  </details>
  <div id="src"></div>
</main>
<script>
/* ---- 實測時刻表（由 VPS 校準後填入；之後純靠手機時鐘計算，不需連線）----
   days: 'wd' 週一至五, 'we' 週六日；from/to: 當天秒數；cycle: 一輪秒數；
   anchor: 某一次「車道轉紅」的 Unix 秒；red: 車道紅燈（可過）秒數 */
let BANDS = /*BANDS*/[{"days": "wd", "from": 0, "to": 3600, "cycle": 120, "anchor": 80, "red": 34, "plan": "05", "lampRed": 47}, {"days": "wd", "from": 3600, "to": 19800, "cycle": 90, "anchor": 50, "red": 34, "plan": "06", "lampRed": 47}, {"days": "wd", "from": 19800, "to": 25200, "cycle": 120, "anchor": 80, "red": 34, "plan": "01", "lampRed": 47}, {"days": "wd", "from": 25200, "to": 34200, "cycle": 200, "anchor": 76, "red": 58, "plan": "09", "lampRed": 71}, {"days": "wd", "from": 34200, "to": 46800, "cycle": 200, "anchor": 118, "red": 56, "plan": "04", "lampRed": 69}, {"days": "wd", "from": 46800, "to": 61200, "cycle": 200, "anchor": 113, "red": 61, "plan": "02", "lampRed": 74}, {"days": "wd", "from": 61200, "to": 72000, "cycle": 200, "anchor": 75, "red": 64, "plan": "11", "lampRed": 82}, {"days": "wd", "from": 72000, "to": 82800, "cycle": 180, "anchor": 121, "red": 44, "plan": "08", "lampRed": 57}, {"days": "wd", "from": 82800, "to": 86400, "cycle": 120, "anchor": 80, "red": 34, "plan": "05", "lampRed": 47}, {"days": "we", "from": 0, "to": 3600, "cycle": 120, "anchor": 80, "red": 34, "plan": "05", "lampRed": 47}, {"days": "we", "from": 3600, "to": 18000, "cycle": 90, "anchor": 50, "red": 34, "plan": "06", "lampRed": 47}, {"days": "we", "from": 18000, "to": 25200, "cycle": 120, "anchor": 80, "red": 34, "plan": "01", "lampRed": 47}, {"days": "we", "from": 25200, "to": 32400, "cycle": 150, "anchor": 90, "red": 44, "plan": "03", "lampRed": 57}, {"days": "we", "from": 32400, "to": 43200, "cycle": 150, "anchor": 90, "red": 44, "plan": "12", "lampRed": 57}, {"days": "we", "from": 43200, "to": 75600, "cycle": 150, "anchor": 55, "red": 64, "plan": "07", "lampRed": 82}, {"days": "we", "from": 75600, "to": 82800, "cycle": 150, "anchor": 90, "red": 44, "plan": "13", "lampRed": 57}, {"days": "we", "from": 82800, "to": 86400, "cycle": 120, "anchor": 80, "red": 34, "plan": "05", "lampRed": 47}]/*END*/;
let SRC = /*SRC*/"臺北市交工處時制表 2026-11-12 版；已用路口攝影機核對 1/12 套時制"/*END*/;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('xw_'+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('xw_'+k, JSON.stringify(v)); }catch(e){} }
};
/* 時刻表每週自動核對更新；抓不到就用頁面內建的版本 */
const SITE = 'https://xians-su.github.io/crosswalk-timer/';
fetch(SITE + 'schedule.json', {cache:'no-store'}).then(r => r.json()).then(s => {
  if (s.bands && s.bands.length){ BANDS = s.bands; SRC = s.note; store.set('sched', s); }
}).catch(() => { const c = store.get('sched', null); if (c && c.bands && c.bands.length){ BANDS = c.bands; SRC = c.note; } });
let walk = store.get('walk', 90), cross = store.get('cross', 25), nudge = store.get('nudge', 0);
let manual = store.get('manual', null);            // {anchor, cycle, red, at}
let mCycle = store.get('cycle', 200), mRed = store.get('red', 95);
const MANUAL_TTL = 3*3600;

function bandFor(t){
  const d = new Date((t + 8*3600)*1000);           // 台北時間
  const dow = d.getUTCDay(), sod = d.getUTCHours()*3600 + d.getUTCMinutes()*60 + d.getUTCSeconds();
  const type = (dow===0||dow===6) ? 'we' : 'wd';
  return BANDS.find(b => b.days===type && sod>=b.from && sod<b.to) || null;
}
function plan(t){
  if (manual && t - manual.at < MANUAL_TTL) return {anchor:manual.anchor+nudge, cycle:mCycle, red:mRed, manual:true};
  const b = bandFor(t);
  return b ? {anchor:b.anchor+nudge, cycle:b.cycle, red:b.red, manual:false} : null;
}
const mod = (a,n) => ((a%n)+n)%n;
function stateAt(p, t){
  const ph = mod(t - p.anchor, p.cycle);
  return ph < p.red ? {go:true, left:p.red-ph, ph} : {go:false, left:p.cycle-ph, ph};
}
/* 最早何時出發，抵達時還剩足夠時間過完 */
function leaveIn(p, t){
  const start0 = t - mod(t - p.anchor, p.cycle);   // 本輪轉紅時刻
  for (let k=0; k<6; k++){
    const s = start0 + k*p.cycle, lastArrive = s + p.red - cross;
    const dep = Math.max(t, s - walk);
    if (dep + walk <= lastArrive) return dep - t;
  }
  return null;
}
const hms = t => new Date((t+8*3600)*1000).toISOString().substr(11,8);

function render(){
  const t = Date.now()/1000;
  $('clock').textContent = hms(t);
  const p = plan(t), now = $('now');
  $('strip').hidden = !p;
  if (!p){
    now.className = 'off'; $('word').textContent = '尚未對時'; $('secs').textContent = '--';
    $('sub').textContent = '這個時段沒有時刻表。到「校正」按「車道剛轉紅」對時'; $('nexts').textContent = '--';
    $('leaveMsg').textContent = '--'; $('leaveMsg').className = '';
  } else {
    const s = stateAt(p, t);
    now.className = s.go ? 'go' : '';
    $('word').textContent = s.go ? '可以過' : '先等等';
    $('secs').textContent = Math.ceil(s.left);
    $('sub').textContent = s.go ? '秒後車道轉綠' : '秒後可以過';
    $('stripGo').style.width = (p.red/p.cycle*100)+'%';
    $('stripNow').style.left = (s.ph/p.cycle*100)+'%';
    $('nexts').textContent = [1,2,3].map(k => hms(t - s.ph + k*p.cycle)).join('　');
    const w = leaveIn(p, t), lm = $('leaveMsg');
    if (w===null){ lm.textContent = '可過時間太短，調整下方秒數'; lm.className=''; }
    else if (w < 1){ lm.textContent = '現在出發'; lm.className='go'; }
    else { lm.textContent = Math.ceil(w)+' 秒後出發'; lm.className=''; }
  }
  $('src').textContent = p && p.manual ? '依你 '+hms(manual.at)+' 的對時推算' : SRC;
}
function labels(){
  $('walkOut').textContent = walk+' 秒'; $('crossOut').textContent = cross+' 秒';
  $('nudgeOut').textContent = (nudge>0?'+':'')+nudge+' 秒';
  $('cycOut').textContent = mCycle+' 秒'; $('redOut').textContent = mRed+' 秒';
}
function bind(id, fn){ $(id).addEventListener('click', () => { fn(); labels(); render(); }); }
bind('walkDn', () => store.set('walk', walk = Math.max(0, walk-5)));
bind('walkUp', () => store.set('walk', walk = Math.min(600, walk+5)));
bind('crossDn', () => store.set('cross', cross = Math.max(5, cross-5)));
bind('crossUp', () => store.set('cross', cross = Math.min(90, cross+5)));
bind('nudgeDn', () => store.set('nudge', nudge -= 1));
bind('nudgeUp', () => store.set('nudge', nudge += 1));
bind('cycDn', () => store.set('cycle', mCycle = Math.max(mRed+5, mCycle-1)));
bind('cycUp', () => store.set('cycle', mCycle = Math.min(400, mCycle+1)));
bind('redDn', () => store.set('red', mRed = Math.max(10, mRed-1)));
bind('redUp', () => store.set('red', mRed = Math.min(mCycle-5, mRed+1)));
bind('sync', () => {
  const t = Date.now()/1000, b = bandFor(t);
  if (b && !store.get('cycleTouched', false)){ mCycle = b.cycle; mRed = b.red; }
  nudge = 0; store.set('nudge', 0);
  manual = {anchor:t, at:t}; store.set('manual', manual);
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
});
bind('clear', () => { manual = null; store.set('manual', null); nudge = 0; store.set('nudge', 0); });
['cycDn','cycUp','redDn','redUp'].forEach(id => $(id).addEventListener('click', () => store.set('cycleTouched', true)));
/* 放在桌上時讓螢幕保持亮著（系統不允許時就略過） */
function keepAwake(){ if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(()=>{}); }
document.addEventListener('visibilitychange', keepAwake); document.addEventListener('click', keepAwake, {once:true}); keepAwake();
/* 要不要帶傘：路口座標的現在雨量、未來一小時每 15 分鐘雨量與降雨機率（Open-Meteo 預報） */
const WX = 'https://api.open-meteo.com/v1/forecast?latitude=25.053&longitude=121.519&current=precipitation,weather_code&minutely_15=precipitation&forecast_minutely_15=5&hourly=precipitation_probability&forecast_hours=2&timezone=Asia%2FTaipei';
function umbrella(d){
  const c = d.current, q = d.minutely_15, code = c.weather_code;
  const prob = Math.max.apply(null, d.hourly.precipitation_probability.filter(v => v !== null).concat(0));
  const wetNow = c.precipitation > 0 || q.precipitation[0] > 0 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95;
  const i = q.precipitation.findIndex((v, k) => k > 0 && v > 0);
  if (wetNow) return {wet:true, msg:'正在下雨，帶傘', prob};
  if (i > 0) return {wet:true, msg:q.time[i].substr(11,5)+' 左右開始下雨，帶傘', prob};
  if (prob >= 40) return {wet:true, msg:'可能下雨，建議帶傘', prob};
  return {wet:false, msg:'不用帶傘', prob};
}
function rain(){
  fetch(WX).then(r => r.json()).then(d => {
    const u = umbrella(d);
    $('rainMsg').textContent = u.msg; $('rainMsg').className = u.wet ? 'wet' : '';
    $('rainSub').textContent = '一小時內降雨機率 '+u.prob+'%（預報，'+hms(Date.now()/1000).substr(0,5)+' 更新）';
  }).catch(() => { $('rainMsg').textContent = '查不到天氣'; $('rainMsg').className = ''; $('rainSub').textContent = '沒有網路或天氣服務沒回應'; });
}
rain(); setInterval(rain, 600000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') rain(); });
labels(); render(); setInterval(render, 250);
</script>
</body>
</html>
