<title>春樹小幸運</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="春樹小幸運">

<style>
/* Layout: everything needed for the decision on one phone screen — signal block, two answer tiles (when to leave, umbrella),
   next crossings, weather figures. Settings, radar and camera sit below as one quiet list. Palette follows the company logo:
   slate gray, cyan accent, sprout yellow marker; green/coral are reserved for the signal state. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#2b3038; --muted:#6e747b; --line:#e2e6ea; --accent:#0596b8;
  --go:#0a7d55; --go-bg:#dff3ea; --wait:#b3401f; --wait-bg:#fbe6de;
  --off-bg:#ffffff; --wet:#b3401f; --pill:rgba(255,255,255,.78); --pill-line:rgba(0,0,0,.12);
  --num:ui-rounded,"SF Pro Rounded","Helvetica Neue",system-ui,sans-serif;
  --text:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121518; --panel:#1c2026; --fg:#eef1f4; --muted:#9aa1a9; --line:#2d333b; --accent:#3ccbee;
  --go:#3fd69b; --go-bg:#0f2e22; --wait:#ff8a63; --wait-bg:#361a10;
  --off-bg:#1c2026; --wet:#ff8a63; --pill:rgba(255,255,255,.1); --pill-line:rgba(255,255,255,.2); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121518; --panel:#1c2026; --fg:#eef1f4; --muted:#9aa1a9; --line:#2d333b; --accent:#3ccbee;
  --go:#3fd69b; --go-bg:#0f2e22; --wait:#ff8a63; --wait-bg:#361a10;
  --off-bg:#1c2026; --wet:#ff8a63; --pill:rgba(255,255,255,.1); --pill-line:rgba(255,255,255,.2); color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
*{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.45;
  padding-top:calc(env(safe-area-inset-top,0px) + 44px);padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
p{margin:0;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.lbl{color:var(--muted);font-size:12px;letter-spacing:.04em}

header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px}
#name{font-size:19px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
#tag{color:var(--muted);font-size:12.5px;text-align:right;min-width:0}

#ptr{position:fixed;z-index:20;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--fg);color:var(--bg);font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px}

/* crossings: one card each. The open card answers go/wait, how long, and when to leave; the others show the same in one line */
#xs{display:flex;flex-direction:column;gap:10px}
.x{border-radius:20px;background:var(--wait-bg);color:var(--wait);transition:background .25s,color .25s;overflow:hidden}
.x.go{background:var(--go-bg);color:var(--go)}
.x.off{background:var(--off-bg);color:var(--muted);border:1px solid var(--line)}
.xhead{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 14px 8px 16px;border:0;border-radius:0;background:none;color:inherit;text-align:left}
.xname{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--fg);white-space:nowrap}
.xname small{font-size:12px;font-weight:500;opacity:.7;margin-left:6px}
.xsum{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;white-space:nowrap;font-variant-numeric:tabular-nums}
.xsum b{font-size:17px;font-weight:800}
.xsum span{font-size:12.5px;color:var(--fg);opacity:.75}
.xhead::after{content:"";flex:none;width:9px;height:9px;margin:0 6px 0 2px;border-right:2.5px solid var(--fg);border-bottom:2.5px solid var(--fg);opacity:.55;transform:rotate(-45deg)}
.x.open .xhead{min-height:44px;padding-top:10px;padding-bottom:0}
.x.open .xhead::after{transform:rotate(45deg);margin:0 4px 5px 4px}
.x.open .xsum,.x:not(.open) .xbody{display:none}
.xbody{padding:0 18px 16px;text-align:center}
.word{font-size:26px;font-weight:800;letter-spacing:.1em;margin-top:2px}
.secs{font-family:var(--num);font-weight:800;font-size:clamp(84px,27vw,108px);line-height:1;font-variant-numeric:tabular-nums}
.sub{font-size:14px;color:var(--fg)}
.strip{position:relative;height:12px;border-radius:6px;background:var(--wait);overflow:hidden;margin-top:12px;opacity:.9}
.strip i{position:absolute;top:0;bottom:0;left:0;background:var(--go)}
.strip u{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--fg);border-radius:2px}
.leave{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--pill);color:var(--fg);text-align:left}
.leaveMsg{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.leaveMsg.go{color:var(--go)}
.walk{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.walk .lbl{font-size:11px;color:var(--fg);opacity:.7}
.walk .step{gap:2px}
.walk button{min-width:40px;min-height:36px;padding:0;border-radius:9px;font-size:18px;border-color:var(--pill-line)}
.walk output{min-width:3.4em;font-size:14px}
.nextRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;white-space:nowrap}
.nextRow .lbl{color:var(--fg);opacity:.7}
.nexts{display:flex;gap:5px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.nexts span{background:var(--pill);border-radius:999px;padding:3px 8px}
@media (max-width:359px){.nexts span:nth-child(3){display:none}}

/* umbrella answer */
#umb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 12px;padding:10px 14px 11px}
#wxLine{flex-basis:100%;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:8px;padding-top:7px}
#umb>div{min-width:0}
#rainMsg{display:block;font-size:19px;font-weight:800;line-height:1.3;white-space:nowrap}
#rainNote{color:var(--muted);font-size:13px;text-align:right;line-height:1.4}
#rainMsg.wet,#rainNote.wet{color:var(--wet)}

/* weather figures: one card, hairline grid */
#wxCells{display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden}
#wxCells:empty{display:none}
.cell{padding:9px 12px 10px;min-width:0;border-top:1px solid var(--line);border-left:1px solid var(--line);margin:-1px 0 0 -1px}
.cell small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell b{display:block;font-family:var(--num);font-size:19px;font-weight:700;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
#rainSub{font-size:13px;color:var(--muted);padding:0 2px}

/* everything optional lives behind one faint line at the very bottom */
#more{padding:0}
#more>summary{justify-content:center;gap:6px;font-size:11.5px;min-height:30px;opacity:.65}
#more[open]>summary{font-weight:400;color:var(--muted)}
#more>section,#more>footer{margin-top:4px}
/* low-key extras: settings, radar, camera — plain text rows, opened only when wanted */
.group{padding:0 2px}
details+details{border-top:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-size:13px;color:var(--muted);min-height:38px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:6px;height:6px;margin-right:4px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);opacity:.7}
details[open]>summary::after{transform:rotate(45deg)}
details[open]>summary{color:var(--fg);font-weight:600}
details>div{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.step output{min-width:4.2em;text-align:center;color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;padding:0 12px;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
#radar{display:block;position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:12px;background:var(--bg)}
#radar img{position:absolute;width:450%;max-width:none;left:-191.75%;top:-239%}
#radar i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid #14201c;background:#ffffff}
#cam{display:block;width:100%;aspect-ratio:3/2;border-radius:12px;background:#000000}

footer{color:var(--muted);font-size:11.5px;line-height:1.6;padding:2px 2px 0;display:grid;grid-template-columns:auto 1fr;column-gap:10px}
footer span:nth-child(odd){opacity:.8}
@media (prefers-reduced-motion: reduce){summary::after,#now{transition:none}}
</style>
</head>

<div id="ptr" hidden>放開重新整理</div>
<main>
  <header><span id="name">春樹小幸運</span><span id="tag">小幸運，就是你的超能力</span></header>

  <div id="xs"></div>

  <section id="umb" class="card">
    <div><span class="lbl">要不要帶傘</span><b id="rainMsg">查詢中</b></div>
    <div id="rainNote"></div>
    <div id="wxLine" hidden></div>
  </section>

  <div id="rainSub" hidden></div>

  <details id="more">
  <summary>設定・天氣細節・雷達・影像</summary>
  <section class="group">
  <details id="adv">
    <summary>設定與校正</summary>
    <div>
      <div class="row"><span>過馬路本身要</span>
        <span class="step"><button id="crossDn" aria-label="減少 5 秒">−</button><output id="crossOut">25 秒</output><button id="crossUp" aria-label="增加 5 秒">＋</button></span></div>
      <p>以下套用在：<b id="selName"></b>（展開哪個路口就調哪個）</p>
      <div class="row"><span>提早／延後</span>
        <span class="step"><button id="nudgeDn" aria-label="提早 1 秒">−1</button><output id="nudgeOut">0 秒</output><button id="nudgeUp" aria-label="延後 1 秒">+1</button></span></div>
      <button id="sync">行人綠燈剛亮（以這一刻重新對時）</button>
      <button id="clear">清除我的對時，改回時刻表</button>
      <p>平常不用校正。若某個時段不準，在路口看到行人綠燈亮起的那一刻按上面的按鈕，之後 3 小時以那一刻為準。</p>
    </div>
  </details>
  <details id="wxBox">
    <summary>天氣細節</summary>
    <div><div id="wxCells" class="card"></div></div>
  </details>
  <details id="radarBox">
    <summary>雷達回波圖</summary>
    <div>
      <a id="radar" href="https://www.cwa.gov.tw/V8/C/W/OBS_Radar.html" target="_blank" rel="noopener" aria-label="開啟氣象署雷達回波頁"><img id="radarImg" alt="雷達回波圖"><i></i></a>
      <p>樹林雷達。白點是路口，畫面寬約 80 公里，顏色越暖雨越大。</p>
    </div>
  </details>
  <details id="camBox">
    <summary>路口即時影像</summary>
    <div>
      <video id="cam" muted playsinline controls></video>
      <p id="camMsg">承德路口往南京西路方向的攝影機，赤峰街口在畫面後方。</p>
    </div>
  </details>
  </section>

  <footer>
    <span>號誌</span><span id="srcX"></span>
    <span>時刻</span><span id="srcNote"></span>
    <span>天氣</span><span>中央氣象署雷達與測站；無測站資料時用 Open-Meteo</span>
  </footer>
  </details>
</main>

function gauge(j){
  let best = null;
  for (const s of j.records.Station){
    const mm = parseFloat(s.RainfallElement.Past10Min.Precipitation);
    if (!(mm >= 0)) continue;                                   // 負值＝儀器缺測
    const g = {mm, name:s.StationName, time:s.ObsTime.DateTime.substr(11,5), at:Date.parse(s.ObsTime.DateTime)/1000};
    if (!best || g.mm > best.mm || (g.mm === best.mm && s.StationId === 'A1A9X0')) best = g;

  return best;
}
function umbrella(d, g, t){
  const c = d.current, q = d.minutely_15, code = c.weather_code;
  const prob = Math.max.apply(null, d.hourly.precipitation_probability.filter(v => v !== null).concat(0));
  const fcNow = c.precipitation > 0 || q.precipitation[0] > 0 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95;
  const i = q.precipitation.findIndex((v, k) => k > 0 && v > 0);
  const fresh = g && t - g.at < 1800;                           // 測站資料超過 30 分鐘就不採用
  if (fresh && g.mm > 0) return {wet:true, msg:'正在下雨，帶傘', prob, g};
  if (!fresh && fcNow) return {wet:true, msg:'正在下雨，帶傘', prob, g:null};
  if (i > 0) return {wet:true, msg:q.time[i].substr(11,5)+' 左右開始下雨，帶傘', prob, g:fresh ? g : null};
  if (prob >= 40 || fcNow) return {wet:true, msg:'可能下雨，建議帶傘', prob, g:fresh ? g : null};

}

function verdict(v, radar, t){

  const past = radar && radar.past && t - radar.past.at < 2700 ? radar.past : null;
  const extra = [];

  if (past && !v.gaugeShown) extra.push({k:'過去一小時', v:past.mm+' mm', n:'雷達估計 '+past.time});
  v.cells = extra.concat(v.cells || []);

  else if (fc && fc.mm >= 0.5){ v.wet = true; v.msg = '一小時內會下雨・雷達預估 '+fc.mm+' mm，帶傘'; }

function cwaView(g, warn, obs, fc, t){

rain(); setInterval(rain, 300000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') rain(); });
/* 加到主畫面後 iPhone 沒有內建的下拉重整，這裡自己做：在頁面最上方往下拉超過 80 點再放開 */
let pullY = null, pullD = 0;
addEventListener('touchstart', e => { pullD = 0; pullY = (window.scrollY <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null; }, {passive:true});
addEventListener('touchmove', e => { if (pullY === null) return; pullD = e.touches[0].clientY - pullY; $('ptr').hidden = pullD < 80; }, {passive:true});
addEventListener('touchend', () => { const go = pullY !== null && pullD >= 80; pullY = null; $('ptr').hidden = true; if (go) location.reload(); });
addEventListener('touchcancel', () => { pullY = null; $('ptr').hidden = true; });
/* 從背景回到頁面時，順便抓一次最新時刻表 */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadSchedule(); });
/* 有些 iPhone 版本在一般區域連點兩下仍會放大：第二下若落在非按鈕處就擋掉 */
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now(), quick = now - lastTap < 350; lastTap = now;
  if (quick && e.cancelable && !e.target.closest('button,summary,a,input,video')) e.preventDefault();
}, {passive:false});
setInterval(render, 250);
</script>
