name: official-plan
# Daily: re-download the official timing plan PDF; if it changed, rebuild the timetable.
on:
  workflow_dispatch:
  schedule:
    - cron: '10 19 * * *'   # every day 03:10 Taipei
permissions:
  contents: write
concurrency: repo-write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 parse_plan.py
      - name: Rebuild and commit
        run: |
          python3 build.py
          git config user.name "crosswalk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -q -m "official plan $(TZ=Asia/Taipei date +%F)" && git pull -q --rebase && git push -q)
