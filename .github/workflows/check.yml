name: camera-check
# Samples the public traffic camera for 13 minutes and compares the lamps with schedule.json.
# Each run downloads about 90 MB of video from the city's camera server, so the schedule is kept modest:
# three checks a day in working hours, plus one sweep of every timing band per week. Times are UTC; Taipei = UTC+8.
on:
  workflow_dispatch:
  schedule:                           # Taipei time in the comments (UTC+8)
    - cron: '0 1,7 * * *'             # every day 09:00 and 15:00  } the hours the page is actually used
    - cron: '40 3 * * *'              # every day 11:40            } (just before the lunch-hour peak)
    # once a week, one check inside every timing band: Wednesday for the weekday plans, Saturday for the weekend plans
    - cron: '25 16,17,23 * * 2,5'     # Wed/Sat 00:25 01:25 07:25
    - cron: '55 21 * * 2'             # Wed 05:55
    - cron: '25 21 * * 5'             # Sat 05:25
    - cron: '55 1 * * 3'              # Wed 09:55
    - cron: '25 5,9,12,15 * * 3'      # Wed 13:25 17:25 20:25 23:25
    - cron: '25 1,4,13,15 * * 6'      # Sat 09:25 12:25 21:25 23:25
permissions:
  contents: write
  actions: read
concurrency: repo-write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # GitHub's own schedule is often late. If something else (a manual run, or a cron on another machine calling
      # `gh workflow run camera-check`) already started a check in the last 50 minutes, a scheduled run has nothing to add.
      - name: Skip if a check ran recently
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow camera-check --limit 10 --json databaseId,createdAt \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select((now - (.createdAt | fromdateiso8601)) < 3000)] | length")
          echo "other checks started in the last 50 minutes: $recent"
          [ "$recent" -gt 0 ] && echo "skip=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - run: pip install --quiet opencv-python-headless numpy
        if: steps.gate.outputs.skip != 'true'
      - name: Sample camera
        if: steps.gate.outputs.skip != 'true'
        run: python3 logger.py 13 /tmp/sample.csv; wc -l /tmp/sample.csv
      - name: Compare with timetable
        if: steps.gate.outputs.skip != 'true'
        id: cmp
        run: python3 check.py /tmp/sample.csv --apply
        continue-on-error: true
      - name: Rebuild and commit
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 build.py
          git config user.name "crosswalk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -q -m "camera check $(TZ=Asia/Taipei date '+%F %H:%M')" && git pull -q --rebase && git push -q)
      - name: Tell somebody
        if: steps.cmp.outcome == 'failure'
        run: echo "A lamp disagrees with the timetable and was not corrected automatically - see the last entries of checks.json" && exit 1
