name: camera-check
# Samples the public traffic camera for 13 minutes inside each timing band, every day,
# and compares the lamps with schedule.json. Times are UTC; Taipei = UTC+8.
on:
  workflow_dispatch:
  schedule:                           # every day, once inside each timing band (Taipei time in the comments)
    - cron: '25 16,17 * * 0-4'        # Mon-Fri 00:25 01:25
    - cron: '55 21 * * 0-4'           # Mon-Fri 05:55
    - cron: '25 23 * * 0-4'           # Mon-Fri 07:25
    - cron: '55 1 * * 1-5'            # Mon-Fri 09:55
    - cron: '25 5,9,12,15 * * 1-5'    # Mon-Fri 13:25 17:25 20:25 23:25
    - cron: '25 16,17,21,23 * * 5,6'  # Sat-Sun 00:25 01:25 05:25 07:25
    - cron: '25 1,4,13,15 * * 6,0'    # Sat-Sun 09:25 12:25 21:25 23:25
    - cron: '0 1,7 * * *'             # every day 09:00 and 15:00: extra checks inside working hours
    - cron: '40 3 * * *'              # every day 11:40: just before the lunch-hour peak
permissions:
  contents: write
concurrency: repo-write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet opencv-python-headless numpy
      - name: Sample camera
        run: python3 logger.py 13 /tmp/sample.csv; wc -l /tmp/sample.csv
      - name: Compare with timetable
        id: cmp
        run: python3 check.py /tmp/sample.csv --apply
        continue-on-error: true
      - name: Rebuild and commit
        run: |
          python3 build.py
          git config user.name "crosswalk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -q -m "camera check $(TZ=Asia/Taipei date '+%F %H:%M')" && git pull -q --rebase && git push -q)
      - name: Tell somebody
        if: steps.cmp.outcome == 'failure'
        run: echo "A lamp disagrees with the timetable and was not corrected automatically - see the last entries of checks.json" && exit 1
